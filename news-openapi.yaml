openapi: 3.0.3
info:
  title: uCoz API - News Module
  description: |
    API документация для модуля "Новости сайта" uCoz.
    
    ## Авторизация Bearer Token
    
    Все запросы к API требуют авторизации через Bearer токен.
    
    Для использования API необходимо:
    1. Получить Bearer токен (токен доступа)
    2. Указать домен вашего сайта в поле "Server" выше
    3. Ввести токен в поле "Authorize" (кнопка справа вверху)
    
    Для получения токена доступа необходимо зарегистрировать приложение на сайте uCoz.
  version: 1.0.0
  contact:
    name: uCoz API Support
    url: https://api.ucoz.net

servers:
  - url: https://{site}/uapi
    description: Базовый URL вашего сайта (укажите свой домен)
    variables:
      site:
        default: yoursite.ucoz.ru
        description: Домен вашего сайта

paths:
  # ============================================
  # МАТЕРИАЛЫ (ENTRIES)
  # ============================================
  /news:
    get:
      summary: Получить все материалы модуля
      description: |
        Получить список всех материалов модуля "Новости сайта".
        Количество материалов на странице зависит от настроек модуля.
      operationId: getNewsEntries
      tags:
        - Entries
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
        - name: date
          in: query
          description: Фильтр по дате в формате yyyy-mm-dd или yyyy
          required: false
          schema:
            type: string
        - name: id
          in: query
          description: ID определенного материала
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsEntriesResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Добавить материал
      description: Добавить новый материал в модуль "Новости сайта"
      operationId: addNewsEntry
      tags:
        - Entries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                category:
                  type: integer
                  description: ID категории
                title:
                  type: string
                  description: Название материала
                description:
                  type: string
                  description: Краткое описание материала
                message:
                  type: string
                  description: Полное описание материала
                comments:
                  type: string
                  enum: [yes, no]
                  description: Позволить оставлять комментарии?
                ontop:
                  type: string
                  enum: [yes, no]
                  description: Показывать материал всегда сверху?
                pending:
                  type: string
                  enum: [yes, no]
                  description: В ожидании ли активации материал?
                end2br_desc:
                  type: string
                  enum: [yes, no]
                  description: Заменять теги переноса на <br /> для краткого описания
                end2br_msg:
                  type: string
                  enum: [yes, no]
                  description: Заменять теги переноса на <br /> для полного описания
                cover:
                  type: string
                  format: binary
                  description: Обложка материала (изображение)
                other1:
                  type: string
                  description: Дополнительное поле 1
                other2:
                  type: string
                  description: Дополнительное поле 2
                other3:
                  type: string
                  description: Дополнительное поле 3
                other4:
                  type: string
                  description: Дополнительное поле 4
                other5:
                  type: string
                  description: Дополнительное поле 5
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsEntryResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Отредактировать материал
      description: Отредактировать существующий материал
      operationId: updateNewsEntry
      tags:
        - Entries
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID материала
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Название материала
                description:
                  type: string
                  description: Краткое описание материала
                message:
                  type: string
                  description: Полное описание материала
                comments:
                  type: string
                  enum: [yes, no]
                ontop:
                  type: string
                  enum: [yes, no]
                pending:
                  type: string
                  enum: [yes, no]
                hgu_title:
                  type: string
                  description: ЧПУ материала
                cover:
                  type: string
                  format: binary
                  description: Обложка материала (изображение)
                other1:
                  type: string
                other2:
                  type: string
                other3:
                  type: string
                other4:
                  type: string
                other5:
                  type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsEntryResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /news/posts:
    delete:
      summary: Удалить материал
      description: Удалить материал из модуля
      operationId: deleteNewsEntry
      tags:
        - Entries
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID материала
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /news/tags:
    post:
      summary: Добавить/изменить теги материала
      description: |
        Добавить, изменить или удалить теги к материалу.
        - Для удаления тегов отправьте пустой запрос
        - Для редактирования отправьте полный список тегов, которые должны остаться
        - Для добавления новых тегов укажите существующие + новые теги
        Теги перечисляются через запятую.
      operationId: updateNewsTags
      tags:
        - Entries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: ID материала
                tags:
                  type: string
                  description: Список тегов через запятую
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================
  # КАТЕГОРИИ (CATEGORIES)
  # ============================================
  /news/category:
    get:
      summary: Получить список категорий
      description: Получить все категории модуля "Новости сайта"
      operationId: getNewsCategories
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID определенной категории
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Добавить категорию
      description: Добавить новую категорию
      operationId: addNewsCategory
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Название категории
                description:
                  type: string
                  description: Описание категории
                hgu_title:
                  type: string
                  description: ЧПУ категории
                position:
                  type: integer
                  description: Позиция категории в списке
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Отредактировать категорию
      description: Отредактировать существующую категорию
      operationId: updateNewsCategory
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID категории
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                hgu_title:
                  type: string
                position:
                  type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Удалить категорию
      description: Удалить категорию
      operationId: deleteNewsCategory
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID категории
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================
  # КОММЕНТАРИИ (COMMENTS)
  # ============================================
  /news/comments:
    get:
      summary: Получить комментарии материала
      description: Получить все комментарии к определенному материалу
      operationId: getNewsComments
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID материала
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Добавить комментарий
      description: Добавить комментарий к материалу
      operationId: addNewsComment
      tags:
        - Comments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - id
                - message
              properties:
                id:
                  type: integer
                  description: ID материала
                message:
                  type: string
                  description: Текст комментария
                parent_id:
                  type: integer
                  description: ID родительского комментария (для ответа на комментарий)
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Отредактировать комментарий
      description: Отредактировать существующий комментарий
      operationId: updateNewsComment
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID комментария
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Текст комментария
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Удалить комментарий
      description: Удалить комментарий
      operationId: deleteNewsComment
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: ID комментария
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        default:
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Введите Bearer токен для авторизации
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          description: Данные об ошибке

    SuccessResponse:
      type: object
      properties:
        success:
          type: object
          properties:
            msg:
              type: string
              example: "Операция выполнена успешно"

    NewsEntry:
      type: object
      properties:
        id:
          type: integer
          description: ID материала
        title:
          type: string
          description: Название материала
        hgu_title:
          type: string
          description: ЧПУ материала
        description:
          type: string
          description: Краткое описание материала
        message:
          type: string
          description: Полное описание материала
        entry_url:
          type: string
          format: uri
          description: Полная ссылка на материал
        author:
          type: string
          description: Полное имя автора материала
        add_date:
          type: string
          description: Время добавления материала
        reads:
          type: integer
          description: Количество просмотров материала
        comments:
          type: string
          enum: [yes, no]
          description: Позволить оставлять комментарии?
        ontop:
          type: string
          enum: [yes, no]
          description: Показывать материал всегда сверху?
        pending:
          type: string
          enum: [yes, no]
          description: В ожидании ли активации материал?
        rating:
          type: number
          description: Рейтинг материала
        rate_num:
          type: integer
          description: Количество голосов (рейтинг)
        rate_sum:
          type: integer
          description: Общая сумма рейтинга
        category:
          $ref: '#/components/schemas/Category'
        other1:
          type: string
          description: Дополнительное поле 1
        other2:
          type: string
          description: Дополнительное поле 2
        other3:
          type: string
          description: Дополнительное поле 3
        other4:
          type: string
          description: Дополнительное поле 4
        other5:
          type: string
          description: Дополнительное поле 5
        prev_entry_url:
          type: string
          format: uri
          description: Полная ссылка на предыдущий материал
        next_entry_url:
          type: string
          format: uri
          description: Полная ссылка на следующий материал

    NewsEntriesResponse:
      type: object
      properties:
        page:
          type: integer
          description: Номер текущей страницы
        pages_list:
          type: string
          description: Общее количество страниц в модуле
        per_page:
          type: integer
          description: Количество материалов на страницу
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsEntry'
        total_news:
          type: integer
          description: Общее количество материалов в модуле

    NewsEntryResponse:
      allOf:
        - $ref: '#/components/schemas/NewsEntry'

    Category:
      type: object
      properties:
        id:
          type: integer
          description: ID категории
        name:
          type: string
          description: Название категории
        description:
          type: string
          description: Описание категории
        url:
          type: string
          format: uri
          description: Ссылка на категорию
        hgu_title:
          type: string
          description: ЧПУ категории
        position:
          type: integer
          description: Позиция категории в списке
        entry_count:
          type: integer
          description: Количество материалов в категории
        access2category:
          type: array
          description: Группы, имеющие доступ к просмотру категории
        access2add:
          type: array
          description: Права на добавление материалов в категорию

    CategoriesResponse:
      type: array
      items:
        $ref: '#/components/schemas/Category'

    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/Category'

    Comment:
      type: object
      properties:
        id:
          type: integer
          description: ID комментария
        message:
          type: string
          description: Текст комментария
        author:
          type: string
          description: Автор комментария
        add_date:
          type: string
          description: Дата добавления комментария
        parent_id:
          type: integer
          description: ID родительского комментария
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          description: Вложенные комментарии

    CommentsResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    CommentResponse:
      allOf:
        - $ref: '#/components/schemas/Comment'
